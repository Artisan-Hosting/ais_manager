          type: string
        artisanMiddlewareVersion:
          type: string
    GetConfigField:
      type: string
      enum:
        - GET_CONFIG_FIELD_UNSPECIFIED
        - GET_CONFIG_FIELD_BUILD_COMMAND
        - GET_CONFIG_FIELD_RUN_COMMAND
        - GET_CONFIG_FIELD_DEPENDENCIES_COMMAND
        - GET_CONFIG_FIELD_LOG_LEVEL
        - GET_CONFIG_FIELD_MEMORY_CAP
        - GET_CONFIG_FIELD_CPU_CAP
        - GET_CONFIG_FIELD_MONITOR_DIRECTORY
        - GET_CONFIG_FIELD_WORKING_DIRECTORY
        - GET_CONFIG_FIELD_CHANGES_NEEDED
        - GET_CONFIG_FIELD_DIR_SCAN_INTERVAL
    SetConfigValue:
      type: object
      description: oneof carrying exactly one config field to change.
      properties:
        buildCommand:
          type: string
        runCommand:
          type: string
        dependenciesCommand:
          type: string
        logLevel:
          type: string
        memoryCap:
          type: integer
          format: uint32
        cpuCap:
          type: integer
          format: uint32
        monitorDirectory:
          type: string
        workingDirectory:
          type: string
        changesNeeded:
          type: integer
          format: uint32
        dirScanInterval:
          type: integer
          format: uint32
      minProperties: 1
      maxProperties: 1
    StartCommand:
      type: object
      required: [application]
      properties:
        application:
          type: string
    StopCommand:
      type: object
      required: [application]
      properties:
        application:
          type: string
    ReloadCommand:
      type: object
      required: [application]
      properties:
        application:
          type: string
    RebuildCommand:
      type: object
      required: [application]
      properties:
        application:
          type: string
    StatusCommand:
      type: object
      required: [application]
      properties:
        application:
          type: string
    InfoCommand:
      type: object
      description: Empty payload.
    SetCommand:
      type: object
      required: [application, value]
      properties:
        application:
          type: string
        value:
          $ref: '#/components/schemas/SetConfigValue'
    GetCommand:
      type: object
      required: [application, field]
      properties:
        application:
          type: string
        field:
          $ref: '#/components/schemas/GetConfigField'
    WatchdogCommandRequest:
      type: object
      description: gRPC oneof; send exactly one command payload.
      properties:
        start:
          $ref: '#/components/schemas/StartCommand'
        stop:
          $ref: '#/components/schemas/StopCommand'
        reload:
          $ref: '#/components/schemas/ReloadCommand'
        rebuild:
          $ref: '#/components/schemas/RebuildCommand'
        status:
          $ref: '#/components/schemas/StatusCommand'
        info:
          $ref: '#/components/schemas/InfoCommand'
        set:
          $ref: '#/components/schemas/SetCommand'
        get:
          $ref: '#/components/schemas/GetCommand'
      minProperties: 1
      maxProperties: 1
    WatchdogCommandResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
        message:
          type: string
          nullable: true
