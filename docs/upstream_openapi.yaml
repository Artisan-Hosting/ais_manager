        end:
          type: integer
          format: uint64
        avgCpu:
          type: number
          format: double
        peakMem:
          type: number
          format: double
        totalRx:
          type: integer
          format: uint64
        totalTx:
          type: integer
          format: uint64
        sampleCount:
          type: integer
          format: uint64
        avgMem:
          type: number
          format: double
    BuildResult:
