        application:
          type: string
        start:
          type: integer
          format: uint64
        end:
          type: integer
          format: uint64
        stream:
          $ref: '#/components/schemas/LogStream'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/HistoricalLogRecord'
        nextCursor:
