[package]
name = "ais_manager"
version = "3.0.0"
edition = "2024"
build = "build.rs"

[dependencies]
artisan_middleware = { git = "https://github.com/Artisan-Hosting/artisan_lib.git", branch = "stable" }
#artisan_middleware = {path = "/opt/artisan/lib/artisan_lib"}
colored = "3.0.0"
gethostname = "1.0.0"
hyper-util = { version = "0.1", features = ["tokio"] }
once_cell = "1.20.2"
prost = "0.13"
simple_comms = "1.2.2"
tower = "0.5"
tokio = "1.41.1"
tonic = { version = "0.12", features = ["transport"] }

[build-dependencies]
tonic-build = "0.12"
